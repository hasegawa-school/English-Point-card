<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Point Card 2.0</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(135deg,#f5fbff,#eef7f0);color:#183047;overflow:hidden}
button{font-family:inherit}
.app{height:100vh;display:flex;flex-direction:column}
.top{height:74px;display:flex;align-items:center;padding:10px 24px;background:#fff;box-shadow:0 2px 12px #0001;flex-shrink:0}
.title{font-size:28px;font-weight:900}
.main{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.points{font-size:clamp(90px,16vw,180px);font-weight:1000;line-height:.85;text-align:center}
.points small{display:block;font-size:22px;letter-spacing:3px;text-align:center;margin-top:15px}
.side{position:absolute;top:50%;transform:translateY(-50%);width:190px;height:190px;border:0;border-radius:36px;font-size:30px;font-weight:900;box-shadow:0 12px 30px #0002;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.side:active{transform:translateY(-50%) scale(.96)}
#myQr{left:24px;background:#fff;color:#173c5b;border:4px solid #173c5b}
#cameraBtn{right:24px;background:#173c5b;color:#fff}
.bottom{height:64px;background:#173c5b;color:#fff;display:flex;align-items:center;padding:0 22px;font-weight:900;letter-spacing:1px;flex-shrink:0}
.lock{position:fixed;inset:0;background:#173c5bf2;color:#fff;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;font-size:36px;font-weight:900}
.lock small{display:block;margin-top:12px;font-size:20px}
.hidden{display:none!important}
.cameraPanel,.writePanel,.qrPanel{position:absolute;inset:0;background:#0d1c29ee;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.cameraPanel{color:#fff}
.cameraBox{width:min(80vw,600px);height:min(62vh,480px);background:#000;border-radius:22px;overflow:hidden}
#reader{width:100%;height:100%}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
.writePanel{background:#fff;z-index:25}
.canvasWrap{width:min(82vw,800px);height:min(62vh,500px);border:5px solid #173c5b;border-radius:20px;background:#fff;box-shadow:0 10px 30px #0002}
.writePanel canvas{width:100%;height:100%;touch-action:none;display:block}
.actions{display:flex;gap:18px}
.actions button{min-width:170px;padding:15px 42px;border:0;border-radius:16px;font-size:22px;font-weight:900;cursor:pointer}
.actions button:disabled{opacity:.5}
.clear{background:#eee;color:#333}.send{background:#173c5b;color:#fff}
.qrCard{background:#fff;padding:28px;border-radius:24px;text-align:center;box-shadow:0 15px 50px #0005}
.qrId{font-size:18px;margin-top:10px;letter-spacing:2px;font-weight:800}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:100;background:#173c5b;color:#fff;padding:28px 42px;border-radius:24px;font-size:34px;font-weight:1000;box-shadow:0 20px 60px #0004;white-space:pre-line;text-align:center}
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.star{position:absolute;font-size:38px;animation:fall 1.8s ease-out forwards}
@keyframes fall{0%{transform:translateY(-10vh) scale(.4) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(105vh) scale(1.4) rotate(720deg);opacity:0}}
.teacher{display:none;position:fixed;inset:0;background:#f4f7fa;z-index:60;overflow:auto}
.teacher.show{display:block}
.teacherHead{background:#173c5b;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:2}
.teacherHead>div{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.teacherGrid{padding:20px;display:grid;grid-template-columns:260px 1fr;gap:14px}
.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 14px #0001}
.teacher button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}
.danger{background:#c62828;color:#fff}
.answer{border-top:1px solid #ddd;padding:14px 0}
.answer:first-child{border-top:0}
.answer img{width:100%;max-height:180px;object-fit:contain;background:#fafafa;border-radius:10px;cursor:pointer}
.badge{display:inline-block;padding:5px 9px;border-radius:10px;font-weight:800;margin:7px 0}
.normal{background:#e5f6e7;color:#176c24}.invalid{background:#ffe5e5;color:#a21d1d}
.answer button{margin-top:8px}
.modal{position:fixed;inset:0;background:#000b;z-index:120;display:flex;align-items:center;justify-content:center}
.modal img{max-width:92vw;max-height:90vh;background:#fff}
.modalClose{position:fixed;right:20px;top:15px;color:#fff;font-size:36px;cursor:pointer}
@media(max-width:800px){.side{width:135px;height:135px;font-size:23px}.teacherGrid{grid-template-columns:1fr}.teacherHead{align-items:flex-start;flex-direction:column}.points{font-size:90px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="title">English Point Card</div></header>
  <main class="main">
    <button class="side" id="myQr">My QR</button>
    <div class="points" id="points">0<small>POINTS</small></div>
    <button class="side" id="cameraBtn">📷 カメラ</button>

    <div id="qrPanel" class="qrPanel hidden">
      <div class="qrCard"><div id="qrcode"></div><div class="qrId" id="myIdText"></div></div>
    </div>

    <div id="cameraPanel" class="cameraPanel hidden">
      <div class="cameraBox"><div id="reader"></div></div>
      <div>QRコードをカメラに見せてね</div>
    </div>

    <div id="writePanel" class="writePanel hidden">
      <div class="canvasWrap"><canvas id="canvas"></canvas></div>
      <div class="actions"><button class="clear" id="clearBtn">消す</button><button class="send" id="sendBtn">送信</button></div>
    </div>
  </main>
  <footer class="bottom" id="total">TOTAL POINTS 0</footer>
</div>

<div id="lock" class="lock hidden">🔒 今は使えません<br><small>先生の指示を待ってね</small></div>
<div id="toast" class="toast hidden"></div>
<div id="celebrate" class="celebrate"></div>

<section id="teacher" class="teacher">
  <div class="teacherHead">
    <b>English Point Card — 先生</b>
    <div>
      <span id="teacherStatus">🔓 活動中</span>
      <button id="lockBtn">🔒 ロック</button>
      <button id="resetBtn" class="danger">授業をリセット</button>
    </div>
  </div>
  <div class="teacherGrid">
    <div class="panel">
      <h2>現在</h2>
      <div id="teacherTotal" style="font-size:50px;font-weight:1000">0</div>
      <div>セクション <span id="section">1</span></div>
    </div>
    <div class="panel">
      <h2>回答一覧</h2>
      <div id="answers"></div>
    </div>
  </div>
</section>

<div id="imgModal" class="modal hidden"><div class="modalClose" onclick="closeImage()">×</div><img id="bigImage"></div>

<script>
const API='https://script.google.com/macros/s/AKfycbxVihqIBKL7GOEsF9z4k7ijqzYiW6WdPDffShfTtNjevqe28N_FmvxR8SJ8vq9F9o-w/exec';
let me=null,target=null,scanner=null,canvas=null,ctx=null,drawing=false,teacherCode='',cameraPointerId=null;
const $=id=>document.getElementById(id);

function post(body){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(r=>r.json());
}
function toast(t,ms=1800){
  $('toast').textContent=t;
  $('toast').classList.remove('hidden');
  setTimeout(()=>$('toast').classList.add('hidden'),ms);
}
function cleanQrText(s){return String(s??'').replace(/[\s\u200B-\u200D\uFEFF]/g,'').trim()}
function validStudent(s){return /^\d{11}$/.test(s)}
function validTeacher(s){return /^ts\d{6}$/i.test(s)}

function init(){
  const p=new URLSearchParams(location.search);
  teacherCode=cleanQrText(p.get('teacher')||'').toLowerCase();
  if(validTeacher(teacherCode)){showTeacherLogin();return;}

  let id=localStorage.getItem('epc_student_id');
  if(!validStudent(id)){
    createLocalStudent();
    return;
  }

  post({action:'studentLogin',id}).then(r=>{
    if(!r.ok)throw Error(r.error);
    me=r;
    refresh();
  }).catch(()=>{
    // 11桁として正しくても、壊れた古い保存値なら新しいIDを発行。
    localStorage.removeItem('epc_student_id');
    createLocalStudent();
  });
}

function createLocalStudent(){
  post({action:'createStudent'}).then(r=>{
    if(!r.ok)throw Error(r.error);
    localStorage.setItem('epc_student_id',r.id);
    me=r;
    refresh();
  }).catch(()=>{
    document.body.innerHTML='<div style="padding:40px;font-size:30px">児童IDを発行できませんでした。先生に知らせてください。</div>';
  });
}

function refresh(){
  if(!me)return;
  post({action:'state',id:me.id}).then(r=>{
    if(!r.ok)return;
    me.points=r.points;
    $('points').firstChild.nodeValue=r.points;
    $('total').textContent='TOTAL POINTS '+r.total;
    if(r.locked)$('lock').classList.remove('hidden');
    else $('lock').classList.add('hidden');
    if(r.notice)showNotice(r.notice);
  });
}
function showNotice(n){toast(n.title+'\n'+n.body,3200)}
setInterval(refresh,3000);

// My QRは押している間だけ表示。
$('myQr').onpointerdown=e=>{
  e.preventDefault();
  if(!me)return;
  $('myQr').setPointerCapture?.(e.pointerId);
  $('qrPanel').classList.remove('hidden');
  $('qrcode').innerHTML='';
  new QRCode($('qrcode'),{text:me.id,width:230,height:230});
  $('myIdText').textContent=me.id;
};
$('myQr').onpointerup=()=>$('qrPanel').classList.add('hidden');
$('myQr').onpointercancel=()=>$('qrPanel').classList.add('hidden');

// カメラも押している間だけ起動。
$('cameraBtn').onpointerdown=e=>{
  e.preventDefault();
  if(!$('lock').classList.contains('hidden'))return;
  cameraPointerId=e.pointerId;
  $('cameraBtn').setPointerCapture?.(e.pointerId);
  startScanner();
};
$('cameraBtn').onpointerup=e=>{
  if(e.pointerId===cameraPointerId){cameraPointerId=null;stopScanner();}
};
$('cameraBtn').onpointercancel=e=>{
  if(e.pointerId===cameraPointerId){cameraPointerId=null;stopScanner();}
};

async function startScanner(){
  if(scanner)return;
  $('cameraPanel').classList.remove('hidden');
  $('reader').innerHTML='';
  scanner=new Html5Qrcode('reader');
  try{
    await scanner.start({facingMode:{exact:'environment'}},{fps:10,qrbox:{width:260,height:260},aspectRatio:1.333333},onScan,()=>{});
  }catch(e){
    try{
      await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:260},aspectRatio:1.333333},onScan,()=>{});
    }catch(e2){
      try{
        await scanner.start({facingMode:'user'},{fps:10,qrbox:{width:260,height:260},aspectRatio:1.333333},onScan,()=>{});
      }catch(e3){
        console.error(e3);
        await stopScanner();
        toast('カメラを使えません。Chromeのカメラ許可を確認してください。',3000);
      }
    }
  }
}
async function stopScanner(){
  if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null;}
  $('cameraPanel').classList.add('hidden');
}

async function onScan(text){
  text=cleanQrText(text);
  if(validTeacher(text))text=text.toLowerCase();
  if(!validStudent(text)&&!validTeacher(text)){
    toast('無効なQRです。');
    return;
  }
  if(text===me.id){
    toast('自分のQRは使えません。');
    return;
  }
  await stopScanner();
  target={id:text};
  openWriter();
}

function openWriter(){
  $('writePanel').classList.remove('hidden');
  setupCanvas();
}
function setupCanvas(){
  canvas=$('canvas');
  ctx=canvas.getContext('2d');
  const r=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=r.width*dpr;
  canvas.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineWidth=5;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.strokeStyle='#173c5b';
  canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture?.(e.pointerId);ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)};
  canvas.onpointermove=e=>{if(!drawing)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()};
  canvas.onpointerup=()=>drawing=false;
  canvas.onpointercancel=()=>drawing=false;
  canvas.onpointerleave=()=>drawing=false;
}

$('clearBtn').onclick=()=>clearCanvas();
function clearCanvas(){
  if(!canvas||!ctx)return;
  const dpr=window.devicePixelRatio||1;
  ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
}

$('sendBtn').onclick=()=>{
  if(!target||!me)return;
  const image=canvas.toDataURL('image/jpeg',.65);
  $('sendBtn').disabled=true;
  post({
    action:'submit',
    studentId:cleanQrText(me.id),
    targetId:cleanQrText(target.id),
    imageData:image
  }).then(r=>{
    if(!r.ok){
      const msg={
        LOCKED:'🔒 今は使えません',
        SELF_SCAN:'自分のQRは使えません。',
        DIRECTION_USED:'この相手とは、この向きでもう使いました。',
        INVALID_TARGET:'QRをもう一度読み取ってください。',
        INVALID_STUDENT_ID:'自分のIDが正しくありません。',
        NO_IMAGE:'手書きの回答を書いてください。'
      }[r.error]||'送信できませんでした';
      toast(msg,2200);
      return;
    }

    $('writePanel').classList.add('hidden');
    target=null;
    clearCanvas();
    me.points=r.points;
    toast('＋1 POINT!',1500);
    celebrate(!!r.teacherTarget);
    refresh();
  }).finally(()=>{$('sendBtn').disabled=false});
};

function celebrate(lux){
  const box=$('celebrate');
  box.innerHTML='';
  for(let i=0;i<(lux?70:18);i++){
    const s=document.createElement('span');
    s.className='star';
    s.textContent=lux?'★':'✦';
    s.style.left=Math.random()*100+'%';
    s.style.top=(-10-Math.random()*30)+'%';
    s.style.animationDelay=Math.random()*.5+'s';
    box.appendChild(s);
  }
  setTimeout(()=>box.innerHTML='',2500);
}

function showTeacherLogin(){
  const c=prompt('先生アカウント（ts＋6桁）を入力');
  if(!validTeacher(c)){
    document.body.innerHTML='<div style="padding:40px;font-size:30px">先生アカウントが正しくありません。</div>';
    return;
  }
  post({action:'teacherLogin',code:cleanQrText(c).toLowerCase()}).then(r=>{
    if(!r.ok)throw 0;
    teacherCode=cleanQrText(c).toLowerCase();
    $('teacher').classList.add('show');
    refreshTeacher();
  });
}

function refreshTeacher(){
  post({action:'teacherState',code:teacherCode}).then(r=>{
    if(!r.ok)return;
    $('teacherStatus').textContent=r.locked?'🔒 ロック中':'🔓 活動中';
    $('lockBtn').textContent=r.locked?'🔓 活動を開始':'🔒 ロック';
    $('teacherTotal').textContent=r.total;
    $('section').textContent=r.section;
    renderAnswers(r.answers);
  });
}

async function renderAnswers(a){
  if(!a.length){$('answers').innerHTML='まだ回答はありません。';return;}

  $('answers').innerHTML=a.slice().reverse().map(x=>`
    <div class="answer" id="ans-${esc(x.answerId)}">
      <b>児童：${esc(x.studentId)}</b><br>
      <b>相手：${esc(x.targetId)}</b><br>
      <span class="badge ${x.status==='INVALID'?'invalid':'normal'}">${x.status==='INVALID'?'🔴 不正':'🟢 正常'}</span>
      <div class="answerImg">読み込み中…</div>
      <button onclick="review('${escJs(x.answerId)}',${x.status!=='INVALID'})">${x.status==='INVALID'?'正常に戻す':'不正にする'}</button>
    </div>`).join('');

  a.forEach(async x=>{
    try{
      const r=await fetch(API+'?action=image&id='+encodeURIComponent(x.imageId)+'&code='+encodeURIComponent(teacherCode));
      const b=await r.text();
      const el=document.querySelector('#ans-'+CSS.escape(x.answerId)+' .answerImg');
      if(el)el.innerHTML=`<img src="data:image/jpeg;base64,${b}" onclick="openImage(this.src)">`;
    }catch(e){
      const el=document.querySelector('#ans-'+CSS.escape(x.answerId)+' .answerImg');
      if(el)el.textContent='画像を読み込めませんでした。';
    }
  });
}

function review(id,currentNormal){
  post({action:'review',code:teacherCode,answerId:id,valid:!currentNormal}).then(r=>{
    if(r.ok){
      if(!currentNormal)toast('不正なポイントをけしました。',2200);
      refreshTeacher();
    }
  });
}

$('lockBtn').onclick=()=>{
  const locked=$('lockBtn').textContent.includes('ロック');
  post({action:'setLock',code:teacherCode,locked}).then(()=>refreshTeacher());
};

$('resetBtn').onclick=()=>{
  if(confirm('ポイント・回答履歴・活動履歴をすべてリセットします。よろしいですか？')){
    post({action:'reset',code:teacherCode}).then(()=>{
      toast('授業をリセットしました');
      refreshTeacher();
    });
  }
};

setInterval(()=>{
  if($('teacher').classList.contains('show'))refreshTeacher();
},3000);

function openImage(src){$('bigImage').src=src;$('imgModal').classList.remove('hidden')}
function closeImage(){$('imgModal').classList.add('hidden')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

init();
</script>
</body>
</html>
