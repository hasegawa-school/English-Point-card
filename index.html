<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Point Card 2.0 - Teacher</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Noto Sans JP",sans-serif}.wrap{max-width:1400px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;background:white;border-radius:22px;padding:18px 24px;box-shadow:0 5px 20px #0001}.title{font-size:30px;font-weight:1000}.status{font-size:24px;font-weight:1000;padding:12px 20px;border-radius:999px}.active{background:#dcfce7;color:#166534}.locked{background:#e5e7eb;color:#374151}.grid{display:grid;grid-template-columns:1fr 330px;gap:18px;margin-top:18px}.panel{background:white;border-radius:22px;padding:20px;box-shadow:0 5px 20px #0001}.controls{display:flex;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:16px 22px;font-size:20px;font-weight:900;cursor:pointer}.unlock{background:#16a34a;color:white}.lock{background:#374151;color:white}.reset{background:#dc2626;color:white}.refresh{background:#e5e7eb}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{background:#f8fafc;border-radius:16px;padding:15px;text-align:center}.num{font-size:38px;font-weight:1000}.label{font-weight:800}.qr{text-align:center}.teacherId{font-size:20px;font-weight:900;letter-spacing:2px;margin-top:8px}.tableWrap{overflow:auto;max-height:600px;margin-top:15px}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid #e5e7eb;text-align:center}th{position:sticky;top:0;background:#f8fafc}.answerImg{width:100px;height:60px;object-fit:contain;border:1px solid #ddd;border-radius:8px;cursor:pointer}.normal{background:#dcfce7}.invalid{background:#fee2e2}.reviewBtn{border:0;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer}.footer{text-align:center;margin:20px;color:#667085}@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="title">English Point Card 2.0 — 先生画面</div><div id="state" class="status locked">🔒 ロック中</div></div>
<div class="grid">
<div>
<div class="panel">
<div class="stats"><div class="stat"><div class="num" id="total">0</div><div class="label">TOTAL POINTS</div></div><div class="stat"><div class="num" id="section">1</div><div class="label">SECTION</div></div><div class="stat"><div class="num" id="count">0</div><div class="label">回答数</div></div></div>
<div class="controls"><button class="btn unlock" id="unlock">🔓 活動開始</button><button class="btn lock" id="lock">🔒 ロック</button><button class="btn refresh" id="refresh">↻ 更新</button><button class="btn reset" id="reset">🗑 授業リセット</button></div>
</div>
<div class="panel"><h2>回答一覧</h2><div class="tableWrap"><table><thead><tr><th>児童</th><th>相手</th><th>回答（手書き）</th><th>状態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div>
<div class="panel qr"><h2>先生QR</h2><div id="teacherQr"></div><div class="teacherId" id="teacherId"></div><p>児童がこのQRを読み取り、英語で話して回答を送信すると＋1 POINT。</p></div>
</div>
<div class="footer">© 2026 Hasegawa Konosuke. All rights reserved.</div>
</div>
<div id="modal" style="display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:99"><img id="bigImg" style="max-width:90vw;max-height:90vh;background:white;border-radius:15px;padding:15px"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzLQonoCntYG6QLyZEO7skoRDlc_emcu6ZLn6nxts-_maBX2cXYNbFHHLy5-GNfdUNa/exec';
const $=x=>document.getElementById(x);
async function api(p){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});return r.json()}
async function init(){const d=await api({action:'teacherInfo'});if(!d.ok){alert('先生画面を読み込めませんでした。GASを再デプロイしてください。');return}if(!$('teacherQr').children.length)new QRCode($('teacherQr'),{text:d.teacherId,width:250,height:250});$('teacherId').textContent=d.teacherId;renderState(d);await refresh()}
function renderState(d){$('state').textContent=d.locked?'🔒 ロック中':'🔓 活動中';$('state').className='status '+(d.locked?'locked':'active');$('section').textContent=d.section}
async function refresh(){const d=await api({action:'teacherState'});if(!d.ok)return;renderState(d);$('total').textContent=d.total;$('count').textContent=d.currentAnswerCount;$('section').textContent=d.section;const rows=$('rows');rows.innerHTML='';d.answers.forEach(a=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(a.studentId)}</td><td>${esc(a.targetId)}</td><td>${a.imageId?`<img class="answerImg" data-id="${esc(a.imageId)}">`:'-'}</td><td class="${a.status==='INVALID'?'invalid':'normal'}">${a.status==='INVALID'?'🔴 不正':'🟢 正常'}</td><td>${a.status==='INVALID'?'<button class="reviewBtn" data-action="normal">正常に戻す</button>':'<button class="reviewBtn" data-action="invalid">不正</button>'}</td>`;tr.querySelector('.answerImg')?.addEventListener('click',()=>showImage(a.imageId));tr.querySelector('.reviewBtn').addEventListener('click',()=>review(a.answerId,tr.querySelector('.reviewBtn').dataset.action));rows.appendChild(tr)})}
async function review(id,status){await api({action:'review',answerId:id,status:status.toUpperCase()});await refresh()}
$('unlock').onclick=async()=>{if(!confirm('新しい活動を開始します。よろしいですか？'))return;await api({action:'setLock',locked:false});await refresh()};
$('lock').onclick=async()=>{await api({action:'setLock',locked:true});await refresh()};
$('refresh').onclick=refresh;
$('reset').onclick=async()=>{if(!confirm('ポイント・回答・不正判定・ペア履歴をすべてリセットします。よろしいですか？'))return;await api({action:'reset'});await refresh()};
async function showImage(id){const d=await api({action:'getImage',imageId:id});if(!d.ok)return;$('bigImg').src=`data:${d.mime};base64,${d.base64}`;$('modal').style.display='flex'}
$('modal').onclick=()=>{$('modal').style.display='none'};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
setInterval(refresh,3000);init();
</script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</body></html>
